[workspace]
members = [
    "crates/sdkwork-api-skills-assembly",
    "crates/sdkwork-skills-contract",
    "crates/sdkwork-intelligence-skills-service",
    "crates/sdkwork-intelligence-skills-repository-sqlx",
    "crates/sdkwork-routes-skills-common",
    "crates/sdkwork-routes-skills-app-api",
    "crates/sdkwork-routes-skills-backend-api",
    "crates/sdkwork-api-skills-standalone-gateway",
    "crates/sdkwork-skills-database-host",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
# 0.9 aligns with the kernel Codex graph (rusqlite 0.39 -> libsqlite3-sys 0.37);
# sqlx-sqlite 0.9 accepts libsqlite3-sys >=0.30.1,<0.38, so the graph unifies at 0.37.0.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }

sdkwork-skills-contract = { path = "crates/sdkwork-skills-contract" }
sdkwork-api-skills-assembly = { path = "crates/sdkwork-api-skills-assembly" }
sdkwork-intelligence-skills-service = { path = "crates/sdkwork-intelligence-skills-service" }
sdkwork-intelligence-skills-repository-sqlx = { path = "crates/sdkwork-intelligence-skills-repository-sqlx" }
sdkwork-routes-skills-common = { path = "crates/sdkwork-routes-skills-common" }
sdkwork-routes-skills-app-api = { path = "crates/sdkwork-routes-skills-app-api" }
sdkwork-routes-skills-backend-api = { path = "crates/sdkwork-routes-skills-backend-api" }
sdkwork-skills-database-host = { path = "crates/sdkwork-skills-database-host" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", package = "sdkwork-database-id" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-drive-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-contract" }
