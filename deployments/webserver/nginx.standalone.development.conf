# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/skills/webserver.pid;
error_log /var/log/sdkwork/skills/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name skills-dev.sdkwork.com skills-dev.birdcoder.com skills-dev.dtupay.com skills-dev.noaper.com skills-dev.sdkwork.cn skills-dev.birdcoder.cn skills-dev.dtupay.cn skills-dev.noaper.cn skills-dev.skubc.com skills-dev.skubc.cn skills-dev.zowalk.com skills-dev.zowalk.cn skills-dev.offer86.com skills-dev.offer86.cn skills-dev.86offer.com skills-dev.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/skills/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
